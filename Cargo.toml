[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.92"
version = "0.11.0"
description = "Restate service for OpenDAL"
license = "MIT"
repository = "https://github.com/sagikazarmark/restate-opendal"
homepage = "https://github.com/sagikazarmark/restate-opendal"

[workspace.dependencies]
anyhow = "1.0"
humantime-serde = "1.1.1"
opendal = { version = "0.57" }
opendal-util = { version = "0.7", features = ["restate"] }
schemars = { version = "1.2", features = ["jiff02", "url2"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
restate-sdk = { version = "0.11", default-features = false }
url = { version = "2.5", features = ["serde"] }

[workspace.metadata.release]
sign-commit = true
sign-tag = true
shared-version = true
tag-message = "Release {{version}}"
tag-name = "v{{version}}"
