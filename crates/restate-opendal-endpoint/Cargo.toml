[package]
name = "restate-opendal-endpoint"
version.workspace = true
description = "Standalone endpoint hosting the OpenDAL service for Restate"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[[bin]]
name = "restate-opendal"
path = "src/main.rs"
doc = false

[dependencies]
restate-opendal = { path = "../restate-opendal", version = "0.11.0" }

anyhow = { workspace = true }
clap = { version = "4.5.57", features = ["derive", "env"] }
figment = { version = "0.10.19", features = ["env", "json", "toml", "yaml"] }
humantime-serde = { workspace = true }
opendal = { workspace = true, features = [
  "services-http",
  "services-s3",
  "services-azblob",
  "services-gcs",
  "services-memory",
  "layers-mime-guess",
  "layers-tracing",
] }
opendal-util = { workspace = true }
restate-sdk = { workspace = true, features = ["http_server", "rust_crypto", "tracing-span-filter"] }
schemars = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = { workspace = true }
